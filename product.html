<!doctype html>
<html lang="az">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Məhsul — Elementstore</title>
        <meta
            name="description"
            content="Elementstore-da məhsul detalları — qiymət, xüsusiyyətlər və WhatsApp üzərindən sifariş."
            id="metaDescription"
        />
        <meta property="og:type" content="product" />
        <meta property="og:site_name" content="Elementstore" />
        <meta property="og:title" content="Məhsul — Elementstore" id="metaOgTitle" />
        <meta property="og:description" content="" id="metaOgDescription" />
        <meta property="og:image" content="" id="metaOgImage" />
        <meta property="og:url" content="" id="metaOgUrl" />
        <link rel="icon" href="images/favicon-32.png" type="image/png" sizes="32x32" />
        <link rel="icon" href="images/favicon-16.png" type="image/png" sizes="16x16" />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <header class="site-header">
            <div class="container">
                <div class="header-inner">
                    <a href="index.html" class="logo">
                        <img
                            src="images/logo-icon.png"
                            alt="Elementstore"
                            class="logo-img"
                        />
                        <span class="logo-text">elementstore.az</span>
                    </a>
                    <nav class="header-nav">
                        <a href="tel:+994703007513" class="nav-phone"
                            >📞 +994 70 300 75 13</a
                        >
                        <button class="cart-btn" id="cartBtn" aria-label="Səbət">
                            <svg
                                width="19"
                                height="19"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <circle cx="9" cy="21" r="1" />
                                <circle cx="20" cy="21" r="1" />
                                <path
                                    d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
                                />
                            </svg>
                            <span
                                class="cart-badge"
                                style="display: none"
                                >0</span
                            >
                        </button>
                    </nav>
                </div>
            </div>
        </header>

        <!-- Cart drawer -->
        <div class="cart-overlay" id="cartOverlay"></div>
        <aside class="cart-drawer" id="cartDrawer">
            <div class="cart-drawer-header">
                <span data-i18n="cart_title">Səbət</span>
                <button class="mobile-close-btn" id="cartClose">✕</button>
            </div>
            <div class="cart-drawer-body" id="cartBody"></div>
            <div class="cart-drawer-footer" id="cartFooter"></div>
        </aside>

        <!-- Floating cart button — stays reachable without scrolling back to the header -->
        <button class="cart-fab cart-btn" aria-label="Səbət">
            <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <circle cx="9" cy="21" r="1" />
                <circle cx="20" cy="21" r="1" />
                <path
                    d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
                />
            </svg>
            <span class="cart-badge" style="display: none">0</span>
        </button>

        <!-- Image lightbox -->
        <div class="lightbox-overlay" id="lightboxOverlay">
            <button
                class="lightbox-close"
                id="lightboxClose"
                aria-label="Bağla"
            >
                ✕
            </button>
            <div class="lightbox-scroll" id="lightboxScroll">
                <img id="lightboxImg" src="" alt="" />
            </div>
        </div>

        <main>
            <div class="container">
                <a href="index.html" class="detail-back" id="backToCatalog">
                    <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M15 18l-6-6 6-6" />
                    </svg>
                    <span data-i18n="back_to_catalog">Kataloqa qayıt</span>
                </a>
                <div class="product-detail" id="productDetail">
                    <div class="loading-state">Məhsul yüklənir...</div>
                </div>
            </div>
        </main>

        <footer class="site-footer">
            <div class="container">
                <p>
                    © 2026 <a href="index.html">elementstore.az</a> · Bütün
                    hüquqlar qorunur
                </p>
            </div>
        </footer>

        <script src="js/i18n.js"></script>
        <script src="js/cart.js"></script>
        <script src="js/product.js"></script>
    </body>
</html>
